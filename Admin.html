<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Gaza - Admin</title>

    <link rel="stylesheet" href="Admin.css">
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">

    <div class="login-box">

        <h1>🍽️ Menu Gaza</h1>
        <h2>دخول المدير</h2>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="البريد الإلكتروني"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="كلمة المرور"
                required
            >

            <button type="submit">
                🔐 تسجيل الدخول
            </button>

            <p id="loginMessage"></p>

        </form>

    </div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="dashboard hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>🍽️ Menu Gaza</h2>

        <button onclick="showPage('home')">
            🏠 الرئيسية
        </button>

        <button onclick="showPage('restaurants')">
            🍽️ المطاعم
        </button>

        <button onclick="showPage('products')">
            🍔 المنتجات
        </button>

        <button onclick="showPage('categories')">
            📂 التصنيفات
        </button>

        <button onclick="showPage('orders')">
            🛒 الطلبات
        </button>

        <button onclick="showPage('settings')">
            ⚙️ الإعدادات
        </button>

        <button onclick="logout()">
            🚪 خروج
        </button>

    </aside>


    <!-- CONTENT -->
    <main class="main-content">


        <!-- HOME -->
        <section id="homePage" class="admin-page">

            <h1>لوحة التحكم</h1>

            <div class="stats-grid">

                <div class="stat-card">
                    <span>🍽️</span>
                    <h3>المطاعم</h3>
                    <strong id="restaurantsCount">0</strong>
                </div>

                <div class="stat-card">
                    <span>🍔</span>
                    <h3>المنتجات</h3>
                    <strong id="productsCount">0</strong>
                </div>

                <div class="stat-card">
                    <span>📂</span>
                    <h3>التصنيفات</h3>
                    <strong id="categoriesCount">0</strong>
                </div>

                <div class="stat-card">
                    <span>🛒</span>
                    <h3>الطلبات</h3>
                    <strong id="ordersCount">0</strong>
                </div>

            </div>

        </section>


        <!-- RESTAURANTS -->
        <section
            id="restaurantsPage"
            class="admin-page hidden"
        >

            <div class="page-header">

                <h1>🍽️ المطاعم</h1>

                <button
                    onclick="openRestaurantModal()"
                    class="primary-btn"
                >
                    ➕ إضافة مطعم
                </button>

            </div>

            <div id="adminRestaurants"></div>

        </section>


        <!-- PRODUCTS -->
        <section
            id="productsPage"
            class="admin-page hidden"
        >

            <div class="page-header">

                <h1>🍔 المنتجات</h1>

                <button
                    onclick="openProductModal()"
                    class="primary-btn"
                >
                    ➕ إضافة منتج
                </button>

            </div>

            <div id="adminProducts"></div>

        </section>


        <!-- CATEGORIES -->
        <section
            id="categoriesPage"
            class="admin-page hidden"
        >

            <h1>📂 التصنيفات</h1>

            <form id="categoryForm">

                <input
                    type="text"
                    id="categoryName"
                    placeholder="اسم التصنيف"
                    required
                >

                <button type="submit">
                    ➕ إضافة
                </button>

            </form>

            <div id="adminCategories"></div>

        </section>


        <!-- ORDERS -->
        <section
            id="ordersPage"
            class="admin-page hidden"
        >

            <h1>🛒 الطلبات</h1>

            <div id="adminOrders"></div>

        </section>


        <!-- SETTINGS -->
        <section
            id="settingsPage"
            class="admin-page hidden"
        >

            <h1>⚙️ الإعدادات</h1>

            <form id="settingsForm">

                <input
                    type="text"
                    value="Menu Gaza"
                >

                <button type="submit">
                    💾 حفظ
                </button>

            </form>

        </section>

    </main>

</div>


<!-- RESTAURANT MODAL -->
<div
    id="restaurantModal"
    class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="restaurantModalTitle">
                ➕ إضافة مطعم
            </h2>

            <button
                type="button"
                onclick="closeRestaurantModal()"
            >
                ×
            </button>

        </div>


        <form id="restaurantForm">

            <input
                type="hidden"
                id="restaurantId"
            >

            <input
                type="text"
                id="restaurantNameAdmin"
                placeholder="اسم المطعم *"
                required
            >

            <textarea
                id="restaurantDescriptionAdmin"
                placeholder="وصف المطعم"
            ></textarea>

            <input
                type="text"
                id="restaurantPhoneAdmin"
                placeholder="رقم الهاتف"
            >

            <input
                type="text"
                id="restaurantWhatsappAdmin"
                placeholder="رقم الواتساب"
            >

            <input
    type="text"
    id="restaurantInstagramAdmin"
    placeholder="حساب إنستغرام"
>

<input
    type="text"
    id="restaurantWebsiteAdmin"
    placeholder="الموقع الإلكتروني للمطعم"
>

            <input
                type="text"
                id="restaurantAreaAdmin"
                placeholder="المنطقة"
            >

            <input
                type="text"
                id="restaurantAddressAdmin"
                placeholder="العنوان"
            >

            <input
                type="url"
                id="restaurantImageAdmin"
                placeholder="رابط صورة المطعم"
            >

      

          

            <input
                type="text"
                id="restaurantCategoryAdmin"
                placeholder="التصنيف"
            >

          <!-- RESTAURANT BRANCHES -->

            <div class="branches-section">

    <h3>📍 فروع المطعم</h3>

    <div id="restaurantBranchesAdmin">
        <!-- الفروع ستظهر هنا -->
    </div>

    <button
        type="button"
        onclick="addBranchAdmin()"
    >
        ➕ إضافة فرع
    </button>

      </div>


            <label>
                <input
                    type="checkbox"
                    id="restaurantFeaturedAdmin"
                >
                ⭐ مطعم مميز
            </label>


            <label>
                <input
                    type="checkbox"
                    id="restaurantActive"
                    checked
                >
                ✅ المطعم فعال
            </label>


            <p id="restaurantFormMessage"></p>


            <div class="modal-actions">

                <button
                    type="button"
                    onclick="closeRestaurantModal()"
                >
                    إلغاء
                </button>

                <button type="submit">
                    💾 حفظ المطعم
                </button>

            </div>

        </form>

    </div>

</div>


<!-- PRODUCT MODAL -->
<div
    id="productModal"
    class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="productModalTitle">
                ➕ إضافة منتج
            </h2>

            <button
                type="button"
                onclick="closeProductModal()"
            >
                ×
            </button>

        </div>


        <form id="productForm">

            <input
                type="hidden"
                id="productId"
            >

            <input
                type="text"
                id="productName"
                placeholder="اسم المنتج"
            >

            <textarea
                id="productDescription"
                placeholder="وصف المنتج"
            ></textarea>

            <input
                type="number"
                id="productPrice"
                step="0.01"
                placeholder="السعر"
            >

            <input type="url" id="productImage" placeholder="رابط صورة المنتج">

<select id="productRestaurant" required>
    <option value="">🍽️ اختر المطعم</option>
</select>

<select id="productCategory">
    <option value="">📂 اختر التصنيف</option>
</select>

<label>
    <input type="checkbox" id="productAvailable" checked>
    ✅ المنتج متوفر
</label>

<label>
    <input type="checkbox" id="productFeatured">
    ⭐ منتج مميز
</label>

            <div class="modal-actions">

                <button
                    type="button"
                    onclick="closeProductModal()"
                >
                    إلغاء
                </button>

                <button type="submit">
                    💾 حفظ المنتج
                </button>

            </div>

        </form>

    </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ADMIN JS -->
<script src="Admin.js"></script>

</body>
</html>
